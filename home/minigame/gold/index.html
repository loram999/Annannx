<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0c102a">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Mini Gold Goal - Annannx Mini Game">
    <title>Mini Gold Goal</title>

    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/png" sizes="64x64" href="/png/favlogoicon.png">
    <link rel="icon" type="image/png" sizes="128x128" href="/png/favlogoicon.png">
    <link rel="icon" type="image/png" sizes="256x256" href="/png/favlogoicon.png">
    <link rel="apple-touch-icon" href="/png/favlogoicon.png">
    <link rel="shortcut icon" href="/png/favlogoicon.png">
    <!-- ===== END FAVICON ===== -->

<style>
/* === CRITICAL FALLBACK CSS (inline so layout doesn't break if /css/index.css fails) === */
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{background:#0c102a;color:#f0f2f6}
body{display:flex;justify-content:center;min-height:100vh;overflow-x:hidden}
img{-webkit-user-drag:none;user-drag:none;pointer-events:auto;-webkit-touch-callout:none;user-select:none;max-width:100%}
.hidden{display:none!important}
.app{width:100%;max-width:480px;background:#0f172a;min-height:100vh;overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0f172a;border-bottom:1px solid #1e293b}
.header-title{font-size:16px;font-weight:600}
button{cursor:pointer;border:none;background:none;color:inherit;font-size:14px}
.balance-card{background:linear-gradient(135deg,#1e293b,#0f172a);margin:12px;border-radius:12px;padding:16px}
.balance-top{display:flex;align-items:center;gap:8px}
.balance-amount{font-size:24px;font-weight:700;color:#fbbf24}
.balance-actions{display:flex;gap:8px;margin-top:12px}
.balance-btn{flex:1;padding:10px;border-radius:8px;font-weight:600}
.balance-btn.withdraw{background:#1e293b;color:#f0f2f6}
.balance-btn.deposit{background:#fbbf24;color:#0f172a}
.betting-section{flex:1;padding:12px;background:#0c102a}
.bet-row{display:flex;gap:8px;margin:8px 0}
.bet-btn{flex:1;padding:12px;border-radius:8px;color:#fff;font-weight:600}
.bet-btn.green{background:#22c55e}.bet-btn.violet{background:#a855f7}.bet-btn.red{background:#ef4444}
.number-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.num-ball{aspect-ratio:1;background:#1e293b;border-radius:50%;display:flex;align-items:center;justify-content:center}
.popup-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999}
.bet-popup-card{background:#1e293b;border-radius:16px;padding:20px;width:90%;max-width:400px}
.popup-amount-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.popup-amount-btn{background:#0f172a;padding:10px;border-radius:8px;color:#fff}
.popup-quantity{display:flex;align-items:center;gap:8px;margin:12px 0}
.qty-input{background:#0f172a;color:#fff;border:none;padding:8px;width:60px;text-align:center;border-radius:8px}
.popup-multipliers{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.mult-btn{background:#0f172a;padding:8px;border-radius:8px;color:#f0f2f6}
.mult-btn.active-mult{background:#fbbf24;color:#0f172a}
.popup-confirm{width:100%;background:#fbbf24;color:#0f172a;padding:12px;border-radius:8px;font-weight:600;margin-top:12px}
</style>

    <link rel="stylesheet" href="/css/index.css">
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

<div id="app">
    <!-- Loading Overlay -->
    <div class="loading-overlay hidden" id="loadingOverlay">
        <div class="loading-title">Mini Gold Goal</div>
        <div class="loading-bar-container">
            <div class="loading-bar" id="loadingBar" style="width: 100%;"></div>
        </div>
        <div class="loading-percent" id="loadingPercent">100%</div>
    </div>

    <!-- Dialog -->
    <div class="dialog-overlay" id="dialogOverlay">
        <div class="dialog-box">
            <div class="dialog-icon" id="dialogIcon">❌</div>
            <div class="dialog-message" id="dialogMessage">လက်ကျန်ငွေ မလုံလောက်ပါ။
Balance: 0.00 MMK</div>
            <button class="dialog-ok-btn" id="dialogOkBtn">OK</button>
        </div>
    </div>

    <!-- Confirm Dialog (Back button) -->
    <div class="dialog-overlay" id="confirmOverlay">
        <div class="dialog-box">
            <div class="dialog-icon" id="confirmIcon">❓</div>
            <div class="dialog-message" id="confirmMessage">ထွက်မာလား?</div>
            <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
                <button class="dialog-ok-btn" id="confirmNo" style="background:#ef4444;">မထွက်ပါ</button>
                <button class="dialog-ok-btn" id="confirmYes" style="background:#2e7d32;">ထွက်မယ်</button>
            </div>
        </div>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="back-btn" id="backBtn">
            <img src="/png/bcakIcon-DIJ4r1KY.png" alt="back" onerror="this.style.display='none'">
        </div>
        <div class="balance-chip" id="balanceChip">
            <span class="coin-icon">
                <img src="/png/balance-Ckse1McI.png" alt="balance" onerror="this.style.display='none'">
            </span>
            K<span id="display-balance">0.00</span>
        </div>
        <div class="sound-btn" id="soundToggle">
            <img src="/png/voice-B3roEJIA.png" alt="sound" id="soundIcon" onerror="this.style.display='none'">
        </div>
    </div>

    <!-- Game Area -->
    <div class="game-area">
        <div class="goal-title">GOAL</div>
        <div class="game-info">
            <div class="game-id" id="game-id-text">Game ID: BGX638458461202262...</div>
            <div class="next-multiplier" id="next-mult">Next: 1.45x</div>
        </div>

        <!-- Grid -->
        <div class="grid" id="grid"><div class="tile disabled" data-index="0">?</div><div class="tile disabled" data-index="1">?</div><div class="tile disabled" data-index="2">?</div><div class="tile disabled" data-index="3">?</div><div class="tile disabled" data-index="4">?</div><div class="tile disabled" data-index="5">?</div><div class="tile disabled" data-index="6">?</div><div class="tile disabled" data-index="7">?</div><div class="tile disabled" data-index="8">?</div><div class="tile disabled" data-index="9">?</div><div class="tile disabled" data-index="10">?</div><div class="tile disabled" data-index="11">?</div></div>

        <!-- Controls -->
        <div class="controls">
            <div class="mock-buttons">
                <div class="mock-btn">RANDOM</div>
                <div class="mock-btn">
                    <div class="switch"></div> Auto Game
                </div>
            </div>
            <div class="mock-buttons">
                <div class="mock-btn" style="background: transparent; border: none;">Field: ◼ ⌄</div>
                <div class="mock-btn" style="background: transparent; border: none;">Mines: 2 ⌄</div>
            </div>
        </div>

        <!-- Betting Area -->
        <div class="bet-area">
            <div class="bet-input-group">
                <div class="bet-amount" id="betAmountClick">
                    <div id="bet-display">1,000</div>
                    <span>MMK</span>
                </div>
                <button class="adjust-btn" id="betMinus">-</button>
                <button class="adjust-btn" id="betPreset">🪙</button>
                <button class="adjust-btn" id="betPlus">+</button>
            </div>

            <div class="action-row">
                <button class="refresh-btn" id="refreshBalance">↻</button>
                <button id="action-btn" class="action-btn btn-bet">စတင်မည်</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-icon">
            <img src="/png/balance-Ckse1McI.png" alt="icon" onerror="this.style.display='none'">
        </div>
        <div id="footer-balance">0.00 MMK</div>
        <div>≡</div>
    </div>

    <!-- Preset Modal -->
    <div class="modal-overlay" id="presetModal">
        <div class="preset-modal scrollable">
            <h3>Bet</h3>
            <div class="preset-grid" id="presetGrid"><button class="preset-btn">1,000</button><button class="preset-btn">2,000</button><button class="preset-btn">5,000</button><button class="preset-btn">10,000</button><button class="preset-btn">20,000</button><button class="preset-btn">50,000</button><button class="preset-btn">100,000</button><button class="preset-btn">200,000</button><button class="preset-btn">500,000</button></div>
        </div>
    </div>

    <!-- Numpad Modal -->
    <div class="modal-overlay" id="numpadModal">
        <div class="numpad-modal">
            <div class="numpad-grid" id="numpadGrid"><button class="num-btn">1</button><button class="num-btn">2</button><button class="num-btn">3</button><button class="num-btn">4</button><button class="num-btn">5</button><button class="num-btn">6</button><button class="num-btn">7</button><button class="num-btn">8</button><button class="num-btn">9</button><button class="num-btn">000</button><button class="num-btn">0</button><button class="num-btn">⌫</button><button class="num-btn submit">✓</button></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
</div>




<script src="index.js"></script>
</body></html>
